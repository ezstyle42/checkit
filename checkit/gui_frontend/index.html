<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>checkit — website consistency checker</title>
<style>
  :root {
    --bg: #0f141b; --panel: #1a2330; --panel2: #222d3d; --text: #e6edf3;
    --muted: #8b98a9; --accent: #4da3ff; --ok: #3fb950; --warn: #d29922;
    --err: #f85149; --border: #303c4d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px;
  }
  header {
    padding: 12px 22px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  header .logo { font-size: 18px; font-weight: 700; color: var(--accent); }
  header .sub { color: var(--muted); font-size: 12px; }
  header .ver { margin-left: auto; color: var(--muted); font-size: 11px; }
  main { display: grid; grid-template-columns: 400px 1fr; gap: 0; height: calc(100vh - 49px); }
  .form { padding: 16px; border-right: 1px solid var(--border); overflow-y: auto; background: var(--panel); }
  .out { display: flex; flex-direction: column; background: var(--bg); min-width: 0; }
  label { display: block; margin: 11px 0 4px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  input[type=text], input[type=password], input[type=number], select {
    width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--text); font-size: 14px;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input:disabled, select:disabled { opacity: .55; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  button {
    margin-top: 14px; width: 100%; padding: 10px; border: 0; border-radius: 6px;
    background: var(--accent); color: #06121f; font-weight: 700; font-size: 14px; cursor: pointer;
  }
  button.secondary { background: var(--panel2); color: var(--text); border: 1px solid var(--border); margin-top: 8px; }
  button:disabled { opacity: .5; cursor: default; }
  button.danger { background: var(--err); color: #fff; }
  .btn-row { display: flex; gap: 8px; }
  .btn-row button { margin-top: 14px; }
  .hint { color: var(--muted); font-size: 11px; margin-top: 4px; }
  .status { margin-top: 12px; padding: 9px 10px; border-radius: 6px; font-size: 12px; display: none; word-break: break-word; }
  .status.info { display: block; background: #12283f; color: var(--accent); }
  .status.ok { display: block; background: #12291a; color: var(--ok); }
  .status.err { display: block; background: #2d1517; color: var(--err); }
  .log {
    flex: 1; overflow-y: auto; padding: 12px 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px; white-space: pre-wrap; word-break: break-word;
  }
  .log .line { margin-bottom: 2px; display: flex; gap: 8px; }
  .log .ts { color: #5a6a7d; flex-shrink: 0; user-select: none; }
  .log .msg.debug { color: var(--muted); }
  .log .msg.info { color: var(--text); }
  .log .msg.warning { color: var(--warn); }
  .log .msg.error { color: var(--err); }
  .log .badge { flex-shrink: 0; font-size: 10px; padding: 0 6px; border-radius: 8px; height: fit-content; margin-top: 1px; user-select: none; }
  .log .badge.debug { background: #222d3d; color: var(--muted); }
  .log .badge.info { background: #12283f; color: var(--accent); }
  .log .badge.warning { background: #2d2410; color: var(--warn); }
  .log .badge.error { background: #2d1517; color: var(--err); }
  .report { flex: 1; overflow-y: auto; padding: 18px 22px; display: none; }
  .report.visible { display: block; }
  .report h1 { font-size: 18px; }
  .report h2 { font-size: 15px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  .report h3 { font-size: 13px; color: var(--accent); }
  .report table { border-collapse: collapse; width: 100%; font-size: 12px; }
  .report th, .report td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
  .report th { background: var(--panel); }
  .report code { background: var(--panel2); padding: 1px 5px; border-radius: 4px; }
  .report a { color: var(--accent); }
  .badge-sev { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; }
  .badge-sev.high { background: #2d1517; color: var(--err); }
  .badge-sev.medium { background: #2d2410; color: var(--warn); }
  .badge-sev.low { background: #12283f; color: var(--accent); }
  .tabs { display: flex; gap: 4px; padding: 8px 16px 0; border-bottom: 1px solid var(--border); align-items: center; }
  .tabs button { width: auto; margin: 0; padding: 8px 16px; border-radius: 6px 6px 0 0; background: transparent; color: var(--muted); font-weight: 600; }
  .tabs button.active { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-bottom: 0; }
  .tabs .spacer { flex: 1; }
  .tabs .autoscroll { color: var(--muted); font-size: 11px; display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .progress { height: 4px; background: var(--panel2); }
  .progress > div { height: 100%; width: 0%; background: var(--accent); transition: width .25s; }
  .checkbox { display: flex; align-items: center; gap: 8px; margin-top: 11px; }
  .checkbox input { width: auto; }
  .checkbox span { color: var(--muted); font-size: 13px; text-transform: none; letter-spacing: 0; }
  fieldset { border: 1px solid var(--border); border-radius: 8px; margin: 14px 0 0; padding: 10px 12px 4px; }
  fieldset legend { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding: 0 6px; }
</style>
</head>
<body>
<header>
  <span class="logo">checkit</span>
  <span class="sub">website crawler &amp; consistency checker</span>
  <span class="ver" id="version"></span>
</header>
<main>
  <div class="form">
    <label for="url">Website URL</label>
    <input id="url" type="text" placeholder="https://example.com" autofocus>

    <label for="out">Output folder</label>
    <input id="out" type="text" placeholder="checkit-out">

    <div class="row">
      <div>
        <label for="max-pages">Max pages</label>
        <input id="max-pages" type="number" value="100" min="1" max="10000">
      </div>
      <div>
        <label for="delay">Delay (s)</label>
        <input id="delay" type="number" value="1" min="0" step="0.1">
      </div>
    </div>

    <div class="row">
      <div>
        <label for="format">Distilled format</label>
        <select id="format">
          <option value="markdown" selected>Markdown (.md)</option>
          <option value="xml">XML (.xml)</option>
        </select>
      </div>
      <div style="display:flex; align-items:flex-end; padding-bottom: 8px;">
        <div class="checkbox" style="margin:0;">
          <input id="verbose" type="checkbox" checked>
          <span>Verbose log</span>
        </div>
      </div>
    </div>

    <div class="checkbox">
      <input id="use-llm" type="checkbox" checked>
      <span>Use LLM for consistency check</span>
    </div>

    <div id="llm-fields">
      <label for="provider">LLM provider</label>
      <select id="provider">
        <option value="mistral" selected>Mistral</option>
        <option value="openai">OpenAI</option>
        <option value="claude">Claude (Anthropic)</option>
      </select>

      <label for="model">Model (optional)</label>
      <input id="model" type="text" placeholder="default per provider">

      <fieldset>
        <legend>API keys (saved locally)</legend>
        <label for="key-mistral">Mistral API key</label>
        <input id="key-mistral" type="password" autocomplete="off" placeholder="sk-…">
        <label for="key-openai">OpenAI API key</label>
        <input id="key-openai" type="password" autocomplete="off" placeholder="sk-…">
        <label for="key-claude">Claude (Anthropic) API key</label>
        <input id="key-claude" type="password" autocomplete="off" placeholder="sk-ant-…">
        <div class="hint">Keys are stored in your user config folder with 0600 permissions. Leave blank to keep the saved key. Env vars and checkit.env are also honoured.</div>
      </fieldset>
    </div>

    <div class="btn-row">
      <button id="run">▶ Run</button>
      <button id="stop" class="danger" disabled>■ Stop</button>
    </div>
    <button id="save" class="secondary">💾 Save settings</button>
    <button id="open-out" class="secondary" disabled>📂 Open output folder</button>

    <div id="status" class="status"></div>
  </div>

  <div class="out">
    <div class="tabs">
      <button id="tab-log" class="active">Log</button>
      <button id="tab-report">Report</button>
      <span class="spacer"></span>
      <label class="autoscroll"><input id="autoscroll" type="checkbox" checked> auto-scroll</label>
    </div>
    <div class="progress"><div id="progress-bar"></div></div>
    <div id="log" class="log"></div>
    <div id="report" class="report"></div>
  </div>
</main>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var logEl = $("log"), reportEl = $("report"), statusEl = $("status");
  var progressBar = $("progress-bar");
  var INPUT_IDS = ["url", "out", "max-pages", "delay", "format", "provider",
                   "model", "use-llm", "verbose", "key-mistral", "key-openai", "key-claude"];

  function setStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.className = "status " + kind;
  }

  function now() {
    var d = new Date();
    return d.toTimeString().slice(0, 8);
  }

  function addLog(level, msg, percent) {
    var div = document.createElement("div");
    div.className = "line";
    var ts = document.createElement("span");
    ts.className = "ts"; ts.textContent = now();
    var badge = document.createElement("span");
    badge.className = "badge " + level; badge.textContent = level.toUpperCase();
    var text = document.createElement("span");
    text.className = "msg " + level;
    text.textContent = (percent != null ? "[" + String(percent).padStart(3) + "%] " : "") + msg;
    div.appendChild(ts); div.appendChild(badge); div.appendChild(text);
    logEl.appendChild(div);
    if ($("autoscroll").checked) logEl.scrollTop = logEl.scrollHeight;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // Minimal markdown -> HTML renderer for the report.
  function renderMarkdown(md) {
    var html = "", lines = md.split("\n"), i, line;
    var inTable = false, inList = false, inHead = false;
    function closeBlocks() {
      if (inTable) { html += inHead ? "</tbody></table>" : "</table>"; inTable = false; inHead = false; }
      if (inList) { html += "</ul>"; inList = false; }
    }
    function inline(s) {
      return escapeHtml(s)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
    }
    for (i = 0; i < lines.length; i++) {
      line = lines[i];
      if (line.startsWith("|")) {
        if (!inTable) { html += "<table>"; inTable = true; }
        var cells = line.split("|").slice(1, -1).map(function (c) { return c.trim(); });
        if (/^[-\s:]+$/.test(cells.join(""))) continue;
        if (!inHead && i > 0 && lines[i - 1].startsWith("|")) {
          html += "<thead><tr>" + cells.map(function (c) { return "<th>" + inline(c) + "</th>"; }).join("") + "</tr></thead><tbody>";
          inHead = true;
          continue;
        }
        html += "<tr>" + cells.map(function (c) { return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>";
        continue;
      }
      closeBlocks();
      if (line.startsWith("### ")) {
        var m = line.match(/^### \d+\.\s*\[(HIGH|MEDIUM|LOW)\]\s*(.*)$/i);
        if (m) {
          html += '<h3><span class="badge-sev ' + m[1].toLowerCase() + '">' + m[1] + "</span> " + inline(m[2]) + "</h3>";
        } else {
          html += "<h3>" + inline(line.slice(4)) + "</h3>";
        }
      }
      else if (line.startsWith("## ")) html += "<h2>" + inline(line.slice(3)) + "</h2>";
      else if (line.startsWith("# ")) html += "<h1>" + inline(line.slice(2)) + "</h1>";
      else if (line.startsWith("- ")) { if (!inList) { html += "<ul>"; inList = true; } html += "<li>" + inline(line.slice(2)) + "</li>"; }
      else if (line.trim() !== "") html += "<p>" + inline(line) + "</p>";
    }
    closeBlocks();
    return html;
  }

  function showTab(which) {
    $("tab-log").classList.toggle("active", which === "log");
    $("tab-report").classList.toggle("active", which === "report");
    logEl.style.display = which === "log" ? "block" : "none";
    reportEl.classList.toggle("visible", which === "report");
  }
  $("tab-log").addEventListener("click", function () { showTab("log"); });
  $("tab-report").addEventListener("click", function () { showTab("report"); });

  $("use-llm").addEventListener("change", function () {
    $("llm-fields").style.display = this.checked ? "block" : "none";
  });

  function setRunning(on) {
    $("run").disabled = on;
    $("stop").disabled = !on;
    $("save").disabled = on;
    INPUT_IDS.forEach(function (id) { $(id).disabled = on; });
    progressBar.style.width = on ? "5%" : "0%";
  }

  function readConfig() {
    var provider = $("provider").value;
    return {
      url: $("url").value.trim(),
      out: $("out").value.trim() || "checkit-out",
      max_pages: parseInt($("max-pages").value, 10) || 100,
      delay: parseFloat($("delay").value) || 1.0,
      fmt: $("format").value,
      use_llm: $("use-llm").checked,
      verbose: $("verbose").checked,
      provider: provider,
      model: $("model").value.trim() || null,
      api_key: $("key-" + provider).value.trim() || null
    };
  }

  function applySettings(s) {
    if (!s) return;
    if (s.url) $("url").value = s.url;
    if (s.out_dir) $("out").value = s.out_dir;
    if (s.max_pages) $("max-pages").value = s.max_pages;
    if (s.delay != null) $("delay").value = s.delay;
    if (s.fmt) $("format").value = s.fmt;
    if (s.use_llm != null) { $("use-llm").checked = s.use_llm; $("llm-fields").style.display = s.use_llm ? "block" : "none"; }
    if (s.provider) $("provider").value = s.provider;
    if (s.model) $("model").value = s.model;
    if (s.verbose != null) $("verbose").checked = s.verbose;
    var keys = s.api_keys || {};
    ["mistral", "openai", "claude"].forEach(function (p) {
      var k = keys[p];
      if (k) {
        $("key-" + p).value = "";
        $("key-" + p).placeholder = "saved: " + k;
      }
    });
    if (s.settings_path) addLog("info", "Settings loaded from " + s.settings_path);
  }

  function isReady() {
    return typeof window.pywebview !== "undefined" && window.pywebview.api;
  }

  $("run").addEventListener("click", function () {
    if (!isReady()) { setStatus("Backend not available.", "err"); return; }
    var cfg = readConfig();
    if (!cfg.url) { setStatus("Please enter a website URL.", "err"); return; }
    setRunning(true);
    setStatus("Running…", "info");
    logEl.innerHTML = "";
    addLog("info", "▶ checkit run " + cfg.url + (cfg.verbose ? " (verbose)" : ""));
    window.pywebview.api.run(cfg).then(function (res) {
      setRunning(false);
      if (res.error) {
        setStatus("Error: " + res.error, "err");
        addLog("error", res.error);
        return;
      }
      setStatus("Done — report: " + res.report_path, "ok");
      addLog("info", "✔ Done. Pages: " + res.pages + ", findings: " + res.findings +
             ", overall: " + (res.overall_ok ? "PASS" : "ISSUES FOUND"));
      $("open-out").disabled = false;
      if (res.report_md) {
        reportEl.innerHTML = renderMarkdown(res.report_md);
        showTab("report");
      }
      progressBar.style.width = "100%";
    }).catch(function (err) {
      setRunning(false);
      setStatus("Error: " + err, "err");
      addLog("error", String(err));
    });
  });

  $("stop").addEventListener("click", function () {
    if (isReady()) window.pywebview.api.cancel();
    addLog("warning", "■ stop requested — finishing current step…");
  });

  $("save").addEventListener("click", function () {
    if (!isReady()) return;
    var provider = $("provider").value;
    var data = {
      url: $("url").value.trim(),
      out_dir: $("out").value.trim() || "checkit-out",
      max_pages: parseInt($("max-pages").value, 10) || 100,
      delay: parseFloat($("delay").value) || 1.0,
      fmt: $("format").value,
      use_llm: $("use-llm").checked,
      verbose: $("verbose").checked,
      provider: provider,
      model: $("model").value.trim(),
      api_keys: {
        mistral: $("key-mistral").value.trim(),
        openai: $("key-openai").value.trim(),
        claude: $("key-claude").value.trim()
      }
    };
    window.pywebview.api.save_settings(data).then(function (res) {
      if (res.saved) {
        setStatus("Settings saved to " + res.path, "ok");
        addLog("info", "💾 Settings saved to " + res.path);
        ["mistral", "openai", "claude"].forEach(function (p) {
          if (data.api_keys[p]) $("key-" + p).placeholder = "saved: ••••" + data.api_keys[p].slice(-4);
          $("key-" + p).value = "";
        });
      } else {
        setStatus("Failed to save settings.", "err");
      }
    });
  });

  $("open-out").addEventListener("click", function () {
    if (isReady()) window.pywebview.api.open_folder(readConfig().out);
  });

  // Poll for backend log/progress events.
  setInterval(function () {
    if (!isReady()) return;
    window.pywebview.api.poll_events().then(function (events) {
      (events || []).forEach(function (ev) {
        if (ev.type === "log") addLog(ev.level || "info", ev.message, ev.percent);
        else if (ev.type === "progress") {
          addLog("info", ev.message, ev.percent);
          progressBar.style.width = ev.percent + "%";
        }
      });
    }).catch(function () {});
  }, 250);

  // Boot: load version + saved settings.
  if (isReady()) {
    window.pywebview.api.version().then(function (v) { $("version").textContent = "v" + v; });
    window.pywebview.api.load_settings().then(applySettings);
  }

  setStatus("Ready.", "info");
})();
</script>
</body>
</html>
