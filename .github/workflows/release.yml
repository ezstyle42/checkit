name: Release build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest -q

      - name: Build sdist and wheel
        run: pip install build && python -m build

      - name: Upload python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: checkit-dist
          path: dist/*

  build-gui:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[gui]" pyinstaller

      - name: Build GUI executable
        run: pyinstaller packaging/checkit.spec --distpath dist-app --workpath build-app --noconfirm

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p artifacts
          if [ -d dist-app/checkit.app ]; then
            # macOS: zip the .app bundle
            ditto -c -k --sequesterRsrc --keepParent dist-app/checkit.app "artifacts/checkit-${{ matrix.name }}.zip" 2>/dev/null || \
              zip -r "artifacts/checkit-${{ matrix.name }}.zip" dist-app/checkit.app
          elif [ -f dist-app/checkit.exe ]; then
            # Windows: zip the onefile executable
            zip -j "artifacts/checkit-${{ matrix.name }}.zip" dist-app/checkit.exe
          else
            # Linux: tar.gz the onefile executable
            tar -czf "artifacts/checkit-${{ matrix.name }}.tar.gz" -C dist-app checkit
          fi
          ls -la artifacts/

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: checkit-gui-${{ matrix.name }}
          path: artifacts/*

  release:
    needs: [test, build-gui]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: checkit-dist
          path: dist

      - uses: actions/download-artifact@v4
        with:
          pattern: checkit-gui-*
          path: gui
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/* gui/* \
            --title "checkit $GITHUB_REF_NAME" \
            --notes "Release $GITHUB_REF_NAME — Python package (sdist/wheel) and self-contained GUI apps for Linux, Windows and macOS."
