name: Release build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest -q

      - name: Build sdist and wheel
        run: pip install build && python -m build

      - name: Upload python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: checkit-dist
          path: dist/*

  build-gui:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos
            # macOS runners are flaky in some environments; don't block the
            # release on them. Re-run the workflow to retry the macOS build.
            continue-on-error: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[gui]" pyinstaller

      - name: Build GUI executable
        run: pyinstaller packaging/checkit.spec --distpath dist-app --workpath build-app --noconfirm

      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p artifacts
          tar -czf "artifacts/checkit-${{ matrix.name }}.tar.gz" -C dist-app checkit
          ls -la artifacts/

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path dist-app\checkit.exe -DestinationPath "artifacts/checkit-${{ matrix.name }}.zip"
          Get-ChildItem artifacts

      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent dist-app/checkit.app "artifacts/checkit-${{ matrix.name }}.zip"
          ls -la artifacts/

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: checkit-gui-${{ matrix.name }}
          path: artifacts/*

  release:
    # build-gui has continue-on-error for macOS, so a macOS runner outage
    # does not block the release; Linux + Windows artifacts always publish.
    needs: [test, build-gui]
    if: |
      startsWith(github.ref, 'refs/tags/') &&
      (needs.test.result == 'success') &&
      (needs.build-gui.result == 'success' || needs.build-gui.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: checkit-dist
          path: dist

      - uses: actions/download-artifact@v4
        with:
          pattern: checkit-gui-*
          path: gui
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/* gui/* \
            --title "checkit $GITHUB_REF_NAME" \
            --notes "Release $GITHUB_REF_NAME — Python package (sdist/wheel) and self-contained GUI apps for Linux, Windows and macOS."
