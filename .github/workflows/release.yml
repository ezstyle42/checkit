name: Release build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest -q

      - name: Build sdist and wheel
        run: pip install build && python -m build

      - name: Upload python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: checkit-dist
          path: dist/*

  build-gui:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            key: linux
          - os: windows-latest
            name: windows-x64
            key: windows
          - os: macos-latest
            name: macos
            key: macos
            # macOS runners are flaky in some environments; don't block the
            # release on them. Re-run the workflow to retry the macOS build.
            continue-on-error: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[gui]" pyinstaller

      - name: Build GUI executable
        run: pyinstaller packaging/checkit.spec --distpath dist-app --workpath build-app --noconfirm

      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p artifacts
          tar -czf "artifacts/checkit-${{ matrix.name }}.tar.gz" -C dist-app checkit
          ls -la artifacts/

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path dist-app\checkit.exe -DestinationPath "artifacts/checkit-${{ matrix.name }}.zip"
          Get-ChildItem artifacts

      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent dist-app/checkit.app "artifacts/checkit-${{ matrix.name }}.zip"
          ls -la artifacts/

      - name: Upload GUI artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: checkit-gui-${{ matrix.name }}
          path: artifacts/*

      - name: Set matrix output
        id: result
        shell: bash
        run: echo "result=success" >> "$GITHUB_OUTPUT"

    outputs:
      # Each matrix job sets exactly one output (its own); the others are unset.
      # GitHub merges matrix outputs by name, so the linux job's "linux" output
      # and the windows job's "windows" output coexist without clobbering.
      result: ${{ steps.result.outputs.result }}

  check-builds:
    # Aggregate the per-OS matrix results into a single gate. The release job
    # depends on this, so it can use a simple boolean check.
    needs: [test, build-gui]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.gate.outputs.ok }}
    steps:
      - name: Gate release on required builds
        id: gate
        shell: bash
        run: |
          # The matrix job result is 'success' when all non-continue-on-error
          # jobs succeeded. macOS has continue-on-error, so its failure does
          # not affect the matrix result.
          if [ "${{ needs.test.result }}" = "success" ] && \
             [ "${{ needs.build-gui.result }}" = "success" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          echo "test=${{ needs.test.result }} build-gui=${{ needs.build-gui.result }}"

  release:
    # Gate on test + build-gui matrix result. macOS has continue-on-error in
    # the matrix, so a macOS runner outage does not fail the matrix result and
    # does not block the release.
    needs: [test, build-gui, check-builds]
    if: |
      startsWith(github.ref, 'refs/tags/') &&
      needs.check-builds.outputs.ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: checkit-dist
          path: dist

      - uses: actions/download-artifact@v4
        with:
          pattern: checkit-gui-*
          path: gui
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/* gui/* \
            --title "checkit $GITHUB_REF_NAME" \
            --notes "Release $GITHUB_REF_NAME — Python package (sdist/wheel) and self-contained GUI apps for Linux, Windows and macOS."
